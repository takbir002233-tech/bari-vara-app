name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets in www folder
        run: |
          mkdir -p www
          cp index.html style.css app.js lucide.min.js html2pdf.bundle.min.js manifest.json icon.png icon-192.png icon-512.png icon.svg www/ || true
          cp -r * www/ 2>/dev/null || true
          rm -rf www/node_modules www/android www/.github www/.git 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.samrat.barivara",
            "appName": "স্মার্ট বিলিং ও বাড়ি ভাড়া",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Billing-App-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
