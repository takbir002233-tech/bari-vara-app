name: Build & Release Android App

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html style.css app.js lucide.min.js html2pdf.bundle.min.js manifest.json icon.png icon-192.png icon-512.png icon.svg www/ || true
          cp -r * www/ 2>/dev/null || true
          rm -rf www/node_modules www/android www/.github www/.git 2>/dev/null || true

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.samrat.barivara",
            "appName": "স্মার্ট বিলিং ও বাড়ি ভাড়া",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Create Official Keystore & Build Clean Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          
          keytool -genkey -v -keystore release.keystore -alias barivara -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Samrat, OU=Billing, O=SmartApp, L=Dhaka, ST=Dhaka, C=BD"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:123456 --ks-key-alias barivara --key-pass pass:123456 --out ../Bari_Vara_Smart_Billing_v1.0.apk $APK_PATH || cp $APK_PATH ../Bari_Vara_Smart_Billing_v1.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bari_Vara_Smart_Billing_App
          path: Bari_Vara_Smart_Billing_v1.0.apk
          retention-days: 30

      - name: Create High-Speed Fast CDN Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Bari Vara Smart Billing App v1.0.0"
          body: "🚀 হাই-স্পিড ডিরেক্ট Android APK ডাউনলোড লিঙ্ক"
          files: Bari_Vara_Smart_Billing_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
